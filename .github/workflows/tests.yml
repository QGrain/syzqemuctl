name: tests

on:
  push:
  pull_request:

jobs:
  unit-tests:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python-version: ["3.8", "3.11", "3.13"]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e .
      - run: python -m compileall -q syzqemuctl tests syzqemuctl-cli-test.py
      - run: python -m unittest discover -s tests

  distributions:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      matrix:
        python-version: ["3.8", "3.11", "3.13"]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip build twine
      - run: python -m build
      - run: python -m twine check --strict dist/*
      - run: SYZQEMUCTL_DIST_DIR=dist python -m unittest tests.test_distribution
      - run: python -m pip install --force-reinstall dist/*.whl
      - run: python -c "import syzqemuctl; assert syzqemuctl.__version__ == '0.3.8'"
        working-directory: ${{ runner.temp }}
      - run: syzqemuctl --help
        working-directory: ${{ runner.temp }}
      - run: python -m pip install --force-reinstall dist/*.tar.gz
      - run: python -c "import syzqemuctl; assert syzqemuctl.__version__ == '0.3.8'"
        working-directory: ${{ runner.temp }}
